<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Profile Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- الهيدر بتاع الصفحة -->
    <header>
        <div style="display: flex; justify-content: space-between; padding: 15px; background: #eee;">
            <h2>Amr Refaat</h2>
            <div>
                <a href="#about" style="margin-left: 10px;">About</a>
                <a href="#skills" style="margin-left: 10px;">Skills</a>
                <a href="#contact" style="margin-left: 10px;">Contact</a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main style="padding: 20px;">
        
        <!-- الصورة -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="images/me.jpg" alt="My Photo" width="150" height="150" style="border-radius: 50%;">
        </div>

        <!-- الكروت التلاتة بجانب بعض -->
        <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
            <div style="border: 1px solid #ccc; padding: 15px; width: 250px;">
                <h3>Skills</h3>
                <p>C#, Unity, and Web basics.</p>
            </div>
            <div style="border: 1px solid #ccc; padding: 15px; width: 250px;">
                <h3>Hobbies</h3>
                <p>Playing games and coding.</p>
            </div>
            <div style="border: 1px solid #ccc; padding: 15px; width: 250px;">
                <h3>College</h3>
                <p>Computer Science student.</p>
            </div>
        </div>

        <!-- الفورم -->
        <div style="max-width: 400px; margin: 0 auto; border: 1px solid #ccc; padding: 20px;">
            <form id="myForm">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" style="width: 100%; margin-bottom: 10px;"><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" style="width: 100%; margin-bottom: 10px;"><br>

                <button type="submit" id="darkBtn" style="padding: 5px 10px;">Toggle Dark Mode</button>
            </form>
        </div>

    </main>

    <!-- الفوتر -->
    <footer style="text-align: center; padding: 10px; background: #eee; margin-top: 20px;">
        <p>&copy; 2026 Amr Refaat</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
